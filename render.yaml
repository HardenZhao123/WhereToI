services:
  - type: web
    name: wheretoi-webapp
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHERETOI_DATABASE_URL
        sync: false
      - key: WHERETOI_RESEND_API_KEY
        sync: false
      - key: WHERETOI_EMAIL_FROM
        sync: false
      - key: WHERETOI_PUBLIC_APP_URL
        value: https://wheretoi-webapp.onrender.com
      - key: PORT
        value: "10000"
