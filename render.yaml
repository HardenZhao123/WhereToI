services:
  - type: web
    name: wheretoi-webapp
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && python3 -m pip install -r requirements-ocr.txt && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHERETOI_OCR_PROVIDER
        value: paddle
      - key: WHERETOI_PADDLEOCR_PYTHON
        value: python3
      - key: WHERETOI_PADDLEOCR_TIMEOUT_MS
        value: "180000"
      - key: WHERETOI_PADDLEOCR_COLD_TIMEOUT_MS
        value: "420000"
      - key: WHERETOI_PADDLEOCR_WARMUP_TIMEOUT_MS
        value: "420000"
      - key: WHERETOI_PADDLEOCR_MAX_IMAGE_DIMENSION
        value: "960"
      - key: WHERETOI_PERSON_DETECTION_PROVIDER
        value: yolo
      - key: WHERETOI_YOLO_PERSON_PYTHON
        value: python3
      - key: WHERETOI_YOLO_PERSON_MODEL
        value: yolo26n-seg.pt
      - key: WHERETOI_YOLO_PERSON_DEVICE
        value: cpu
      - key: WHERETOI_YOLO_PERSON_CONFIDENCE
        value: "0.25"
      - key: WHERETOI_YOLO_PERSON_IMAGE_SIZE
        value: "384"
      - key: WHERETOI_YOLO_PERSON_MAX_IMAGE_DIMENSION
        value: "640"
      - key: WHERETOI_YOLO_PERSON_BLUR_RADIUS
        value: "18"
      - key: WHERETOI_YOLO_PERSON_TIMEOUT_MS
        value: "180000"
      - key: WHERETOI_YOLO_PERSON_COLD_TIMEOUT_MS
        value: "300000"
      - key: WHERETOI_YOLO_PERSON_WARMUP_TIMEOUT_MS
        value: "300000"
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: WHERETOI_CLEANLINESS_SCORING_MODEL
        value: bias_training
      - key: WHERETOI_DATABASE_URL
        sync: false
      - key: WHERETOI_REQUIRE_DATABASE_URL
        value: "true"
      - key: WHERETOI_ALLOW_DB_FALLBACK
        value: "false"
      - key: WHERETOI_ENABLE_DEMO_ACCOUNT
        value: "false"
      - key: WHERETOI_RESEND_API_KEY
        sync: false
      - key: WHERETOI_EMAIL_FROM
        sync: false
      - key: WHERETOI_PUBLIC_APP_URL
        value: https://wheretoi-webapp.onrender.com
      - key: PORT
        value: "10000"
