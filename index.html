<html lang="en">

      name="description"

    <link rel="icon" type="image/png" href="./src/logo.png" />

          <template data-html-include="./src/html/topbar.html"></template>
          <template data-html-include="./src/html/map-view.html"></template>
          <template data-html-include="./src/html/account-view.html"></template>

    <script

    <script src="./src/main.js?v=toilet-stars-2" type="module"></script>
    <template data-html-include="./src/html/auth-modal.html"></template>
    <template data-html-include="./src/html/profile-modal.html"></template>
