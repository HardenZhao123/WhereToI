plugins {
    id "com.android.application"
}

android {
    namespace "com.wheretoi.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.wheretoi.app"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
