    <section class="profile-modal is-hidden" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <div class="profile-dialog">
        <h2 id="profile-title">Set up your profile</h2>
        <p id="profile-subtitle">This is optional but helps us show you the best toilets.</p>
        <form id="profile-form" class="profile-form">
          <div>
            <label for="profile-gender">Gender Preference</label>
            <select id="profile-gender" style="width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px;">
              <option value="">Choose...</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="neutral">Gender Neutral</option>
            </select>
          </div>
          <div class="preferences-group">
            <p>My Needs</p>
            <label><input type="checkbox" name="need" value="accessible" /> Accessible</label>
            <label><input type="checkbox" name="need" value="babyChanging" /> Baby Changing</label>
            <label><input type="checkbox" name="need" value="free" /> Free toilets only</label>
            <label><input type="checkbox" name="need" value="radarKey" /> RADAR Key access</label>
          </div>
          <div class="profile-actions">
            <button class="solid-button" type="submit">Save Profile</button>
            <button class="text-button" id="skip-profile" type="button" style="background: none; border: none; padding: 10px; color: var(--muted); cursor: pointer;">Skip for now</button>
          </div>
        </form>
      </div>
    </section>
