    <section class="auth-modal is-hidden" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="auth-dialog">
        <button class="close-button sticky-close-button" id="close-auth" type="button" aria-label="Close login dialog">X</button>
        <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px;">
          <div class="header-branding">
            <img src="./src/logo.png" alt="" class="app-logo" aria-hidden="true" />
            <div>
              <h2 id="auth-title" style="margin-bottom: 4px; color: #142c72; font-size: 18px; font-weight: 700;">Log in to WhereToI</h2>
              <p id="auth-subtitle" style="margin: 0; font-size: 12px; color: var(--muted);">Manage your history and profile filters.</p>
            </div>
          </div>
        </header>
        <form id="auth-form" class="auth-form" style="margin-top: 0;">
          <div id="email-group" class="is-hidden">
            <label for="auth-email">Email</label>
            <input id="auth-email" type="email" placeholder="email@example.com" autocomplete="email" />
          </div>
          <div>
            <label for="auth-username">Username</label>
            <input id="auth-username" type="text" placeholder="Your username" required autocomplete="username" />
          </div>
          <div>
            <label for="auth-password">Password</label>
            <input id="auth-password" type="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <div id="confirm-password-group" class="is-hidden">
            <label for="auth-confirm-password">Confirm password</label>
            <input id="auth-confirm-password" type="password" placeholder="••••••••" autocomplete="new-password" />
          </div>
          <button class="solid-button" id="auth-submit" type="submit">Log in</button>
        </form>
        <p class="auth-status" id="auth-status" aria-live="polite"></p>
        <p class="auth-switch" id="auth-switch-text">
          <span id="auth-switch-copy">Don't have an account?</span> <button id="auth-toggle" type="button">Sign up</button>
        </p>
      </div>
    </section>
