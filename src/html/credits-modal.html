<section class="auth-modal is-hidden" id="credits-modal" role="dialog" aria-modal="true" aria-labelledby="credits-title">
  <div class="auth-dialog">
    <button class="close-button sticky-close-button" id="close-credits" type="button" aria-label="Close credits dialog">X</button>
    <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px;">
      <div>
        <h2 id="credits-title" style="margin-bottom: 4px; color: #142c72; font-size: 18px; font-weight: 700;">Data Attribution &amp; Credits</h2>
      </div>
    </header>
    <div class="credits-content" style="padding: 10px 0;">
      <p style="font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 16px;">
        This project is a collaborative prototype designed by a team of four students to test toilet accessibility and feedback systems.
      </p>
      <div style="background: var(--teal-soft); padding: 16px; border-radius: 12px; margin-bottom: 20px;">
        <h3 style="font-size: 14px; margin-bottom: 8px; color: var(--teal); font-weight: 700;">Data Source</h3>
        <p style="font-size: 13px; line-height: 1.5; color: var(--ink);">
          Toilet data sourced from the public domain and provided under the 
          <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener" style="color: var(--teal); font-weight: 600;">CC BY 4.0</a> 
          International license.
        </p>
      </div>
      <button class="solid-button" id="dismiss-credits" type="button" style="width: 100%;">Close</button>
    </div>
  </div>
</section>
