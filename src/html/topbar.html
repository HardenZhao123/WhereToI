          <header class="topbar">
            <div class="header-branding">
              <img src="./src/logo.png" alt="" class="app-logo" aria-hidden="true" />
              <div>
                <p class="eyebrow">WhereToI</p>
                <h1 id="view-title">Map</h1>
              </div>
            </div>
            <div class="header-map-actions">
              <button class="add-toilet-topbar-button" id="add-toilet-open" type="button" aria-label="Add missing toilet">
